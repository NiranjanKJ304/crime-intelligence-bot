
services:
  backend:
    # Overrides for local development
    volumes:
      - ./backend/app:/app/app
      # Mount the store specifically to ensure host and container sync
      - ./backend/app/document_generation/store:/app/app/document_generation/store
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-exclude", "app/document_generation/store*"]
    # Allow python to read local env file if needed, though env_file from base is used
    environment:
      # Override the Docker databases to use the Windows host databases
      DATABASE_URL: postgresql://postgres:user1234@host.docker.internal:5432/police_db
      NEO4J_URI: bolt://host.docker.internal:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: crime123
