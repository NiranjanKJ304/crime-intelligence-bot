
services:
  backend:
    # Overrides for local development
    volumes:
      - ./backend/app:/app/app
      # Mount the store specifically to ensure host and container sync
      - ./backend/app/document_generation/store:/app/app/document_generation/store
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    # Allow python to read local env file if needed, though env_file from base is used
